name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.architecture }}
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, ARM64]
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Validate release version and tag
        shell: pwsh
        run: |
          $version = ./scripts/test-version.ps1 -ReleaseTag $env:GITHUB_REF_NAME
          "TRAY_VERSION=$version" >> $env:GITHUB_ENV

      - name: Configure
        run: cmake -S . -B build -A ${{ matrix.architecture }}

      - name: Build
        run: cmake --build build --config Release

      - name: Run isolated self-test
        if: matrix.architecture == 'x64'
        shell: pwsh
        run: |
          $process = Start-Process `
            -FilePath .\build\Release\TrayIconPromoter.exe `
            -ArgumentList '--self-test', '--silent' `
            -WindowStyle Hidden `
            -PassThru
          if (-not $process.WaitForExit(15000)) {
            $process.Kill($true)
            throw 'Self-test did not exit within 15 seconds.'
          }
          if ($process.ExitCode -ne 0) {
            throw "Self-test failed with exit code $($process.ExitCode)"
          }

      - name: Run install lifecycle test
        if: matrix.architecture == 'x64'
        shell: pwsh
        run: >-
          ./scripts/test-install.ps1
          -Executable ./build/Release/TrayIconPromoter.exe
          -FailureExecutable ./build/Release/TrayIconPromoterInstallerTests.exe
          -ExpectedVersion $env:TRAY_VERSION

      - name: Run native regression tests
        if: matrix.architecture == 'x64'
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          $package = 'package'
          New-Item -ItemType Directory -Path $package | Out-Null
          Copy-Item .\build\Release\TrayIconPromoter.exe $package
          Copy-Item .\README.md $package
          Copy-Item .\LICENSE $package
          Compress-Archive -Path "$package\*" -DestinationPath "TrayIconPromoter-$env:GITHUB_REF_NAME-${{ matrix.architecture }}.zip"

      - name: Upload package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-${{ matrix.architecture }}
          path: TrayIconPromoter-${{ github.ref_name }}-${{ matrix.architecture }}.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: release

      - name: Create checksums
        working-directory: release
        run: sha256sum *.zip > SHA256SUMS.txt

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: |
            release/*.zip
            release/SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release/*
          --repo "${{ github.repository }}"
          --title "Tray Icon Promoter $GITHUB_REF_NAME"
          --generate-notes
          --verify-tag
