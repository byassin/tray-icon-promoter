name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.architecture }}
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, ARM64]

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Validate version metadata
        shell: pwsh
        run: |
          $version = ./scripts/test-version.ps1
          "TRAY_VERSION=$version" >> $env:GITHUB_ENV

      - name: Configure
        run: cmake -S . -B build -A ${{ matrix.architecture }}

      - name: Build
        run: cmake --build build --config Release

      - name: Run isolated self-test
        if: matrix.architecture == 'x64'
        shell: pwsh
        run: |
          $process = Start-Process `
            -FilePath .\build\Release\TrayIconPromoter.exe `
            -ArgumentList '--self-test', '--silent' `
            -WindowStyle Hidden `
            -PassThru
          if (-not $process.WaitForExit(15000)) {
            $process.Kill($true)
            throw 'Self-test did not exit within 15 seconds.'
          }
          if ($process.ExitCode -ne 0) {
            throw "Self-test failed with exit code $($process.ExitCode)"
          }

      - name: Run native regression tests
        if: matrix.architecture == 'x64'
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Run install lifecycle test
        if: matrix.architecture == 'x64'
        shell: pwsh
        run: >-
          ./scripts/test-install.ps1
          -Executable ./build/Release/TrayIconPromoter.exe
          -FailureExecutable ./build/Release/TrayIconPromoterInstallerTests.exe
          -ExpectedVersion $env:TRAY_VERSION

      - name: Upload executable
        uses: actions/upload-artifact@v7.0.2
        with:
          name: TrayIconPromoter-${{ matrix.architecture }}
          path: build/Release/TrayIconPromoter.exe
          if-no-files-found: error
