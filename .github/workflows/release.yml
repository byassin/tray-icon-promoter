name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.architecture }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, ARM64]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A ${{ matrix.architecture }}

      - name: Build
        run: cmake --build build --config Release

      - name: Run isolated self-test
        if: matrix.architecture == 'x64'
        shell: pwsh
        run: |
          & .\build\Release\TrayIconPromoter.exe --self-test --silent
          if ($LASTEXITCODE -ne 0) {
            throw "Self-test failed with exit code $LASTEXITCODE"
          }

      - name: Package
        shell: pwsh
        run: |
          $package = 'package'
          New-Item -ItemType Directory -Path $package | Out-Null
          Copy-Item .\build\Release\TrayIconPromoter.exe $package
          Copy-Item .\README.md $package
          Copy-Item .\LICENSE $package
          Compress-Archive -Path "$package\*" -DestinationPath "TrayIconPromoter-${{ github.ref_name }}-${{ matrix.architecture }}.zip"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.architecture }}
          path: TrayIconPromoter-${{ github.ref_name }}-${{ matrix.architecture }}.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release

      - name: Create checksums
        working-directory: release
        run: sha256sum *.zip > SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          release/*
          --repo "${{ github.repository }}"
          --title "Tray Icon Promoter ${{ github.ref_name }}"
          --generate-notes
          --verify-tag

