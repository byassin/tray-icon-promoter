name: Bug report
description: Report incorrect behavior on Windows 11
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a problem.
  - type: input
    id: version
    attributes:
      label: Tray Icon Promoter version
      placeholder: 1.0.0 x64
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and build
      placeholder: Windows 11 24H2, build 26100.x
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the affected application and what its tray icon did.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Install...
        2. Update...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Status output
      description: Run TrayIconPromoter.exe --status and copy the values shown.

