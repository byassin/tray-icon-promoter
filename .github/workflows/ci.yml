name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.architecture }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, ARM64]

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Configure
        run: cmake -S . -B build -A ${{ matrix.architecture }}

      - name: Build
        run: cmake --build build --config Release

      - name: Run isolated self-test
        if: matrix.architecture == 'x64'
        shell: pwsh
        run: |
          $process = Start-Process `
            -FilePath .\build\Release\TrayIconPromoter.exe `
            -ArgumentList '--self-test', '--silent' `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Self-test failed with exit code $($process.ExitCode)"
          }

      - name: Run install lifecycle test
        if: matrix.architecture == 'x64'
        shell: pwsh
        run: >-
          ./scripts/test-install.ps1
          -Executable ./build/Release/TrayIconPromoter.exe
          -ExpectedVersion '1.1.0'

      - name: Upload executable
        uses: actions/upload-artifact@v7.0.1
        with:
          name: TrayIconPromoter-${{ matrix.architecture }}
          path: build/Release/TrayIconPromoter.exe
          if-no-files-found: error
